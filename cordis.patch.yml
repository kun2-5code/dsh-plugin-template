# dsh-plugin-template 的 bundle 配置层：装进 profile 后生效。
# 每个插件占一行；行 id 就是宿主派生 settings 命名空间时用的 id，
# 也是客户端在 Plugins 页上贡献配置页时用的键，三处必须一致。
#
# 场景切换在设置里改：设置 → 插件 里的开关、启用/禁用。
# 浏览器半边见 src/client/，在设置命名空间 dsh-plugin-template 下面渲染配置表单。
- insert:
    - id: dsh-plugin-template
      name: dsh-plugin-template
      config:
        greeting: 'Hello from dsh-plugin-template'
        maxRetries: 3
        verbose: false
    # 可选示例：Service 提供者（见 src/service.ts），需要时删掉注释并注册。
    # 注意 tsdown 会把它打成独立的 lib/service.js 入口。
    #
    # 子路径行不会带上浏览器半边：client-modules 只把门面挂在「裸包名」那一行上。
    # 需要自带页面的子插件应当单独成一个包。
    # - id: dsh-plugin-template-service
    #   name: 'dsh-plugin-template/service'
    #
    # 可选示例：hook 权限拦截器（见 src/hook.ts），需要时删掉注释并注册。
    # - id: dsh-plugin-template-permission-gate
    #   name: 'dsh-plugin-template/hook'
    #   config:
    #     denyTools: ['bash']
