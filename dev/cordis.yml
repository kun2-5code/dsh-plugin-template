# 本地开发 overlay：在 deepseek-harness 源码根目录运行
#
#   pnpm dsh web --patch /absolute/path/to/dsh-plugin-template/dev/cordis.yml
#
# 插件路径必须为绝对路径（overlay 不改变 profile 的模块解析目录）。
# 把下面的 name 改成这个仓库在你机器上的绝对路径。
#
# 注意：overlay 只加载 host 半边（模块解析到源码文件，发现不了 dsh.client 包级声明）。
# 要测试浏览器半边的配置卡片（src/client.ts），必须把包安装进 profile：
#   pnpm dsh plugin --profile web add /absolute/path/to/dsh-plugin-template && pnpm dsh web
- insert:
    - id: dsh-plugin-template
      name: '/absolute/path/to/dsh-plugin-template/src/index.ts'
      config:
        greeting: 'Hello from dev overlay'
        verbose: true
